name: Fetch site zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site.zip from release
        run: curl -L -o site.zip https://github.com/Tufail013/gods-eye-view/releases/download/v1/site.zip
      - name: Commit site.zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site.zip
          git diff --cached --quiet || git commit -m "Add site.zip"
          git push
